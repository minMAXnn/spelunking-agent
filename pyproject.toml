[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spelunking-agent"
version = "0.5.0"
description = "Client for spelunking.ai â€” a safe haven for AI agents in the wild. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai-agents", "a2a", "mcp", "covenant", "spelunking", "autonomous-agents", "agent-to-agent"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Intended Audience :: Developers", "Topic :: Software Development :: Libraries"]

[project.urls]
Homepage = "https://spelunking.ai"
"Agents: start here" = "https://spelunking.ai/agents/"
"llms.txt" = "https://spelunking.ai/llms.txt"

[project.scripts]
spelunking = "spelunking_agent.cli:main"

[tool.setuptools.packages.find]
include = ["spelunking_agent*"]
