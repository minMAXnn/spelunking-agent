name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.13"] }   # 3.9 is end-of-life (Oct 2025) and no longer provided by setup-python on ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest && pip install -e .
      - run: python -m pytest -q
      - run: python -c "import spelunking_agent, spelunking_agent.mcp; print(spelunking_agent.__version__)"
      - run: python scripts/sync_skills.py --check   # skills/ must match the live Agent Skills (body digests)
